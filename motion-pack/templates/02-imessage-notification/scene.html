<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 1080px; height: 1920px;
    overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
  }
  /* iOS lock screen background — soft warm gradient with blurred light */
  body::before {
    content: ""; position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 25% 20%, rgba(255,200,140,0.18) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 80%, rgba(140,180,255,0.15) 0%, transparent 50%),
      linear-gradient(180deg, #2A2520 0%, #0A0808 100%);
  }

  /* iOS status bar */
  .status-bar {
    position: absolute;
    top: 36px; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 56px;
    color: #FFF; font-size: 30px; font-weight: 600;
    z-index: 20;
  }
  .status-bar .icons {
    display: flex; gap: 14px; align-items: center;
  }
  .signal-bars { display: inline-flex; gap: 4px; align-items: flex-end; }
  .signal-bars span {
    display: block; width: 5px; background: #FFF; border-radius: 1.5px;
  }
  .signal-bars span:nth-child(1) { height: 7px; }
  .signal-bars span:nth-child(2) { height: 10px; }
  .signal-bars span:nth-child(3) { height: 13px; }
  .signal-bars span:nth-child(4) { height: 16px; }
  .battery {
    width: 46px; height: 22px;
    border: 2px solid #FFF; border-radius: 5px;
    position: relative; padding: 2px;
  }
  .battery::after {
    content: ""; position: absolute; top: 50%; right: -5px;
    transform: translateY(-50%);
    width: 3px; height: 8px; background: #FFF; border-radius: 0 2px 2px 0;
  }
  .battery-fill { width: 80%; height: 100%; background: #FFF; border-radius: 1.5px; }

  /* Lock screen big time */
  .lock-time {
    position: absolute;
    top: 130px; left: 0; right: 0;
    text-align: center;
    color: #FFF;
    z-index: 5;
  }
  .lock-time .date {
    font-size: 30px; font-weight: 500;
    margin-bottom: 4px;
    color: rgba(255,255,255,0.9);
    letter-spacing: -0.2px;
  }
  .lock-time .time {
    font-size: 200px; font-weight: 200; letter-spacing: -8px;
    line-height: 1;
  }

  /* Notification stack */
  .notif-stack {
    position: absolute;
    top: 720px; left: 56px; right: 56px;
    display: flex; flex-direction: column; gap: 12px;
    z-index: 10;
  }
  .notification {
    background: rgba(45, 40, 38, 0.55);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 32px;
    padding: 22px 26px;
    box-shadow: 0 14px 44px rgba(0,0,0,0.45);
    opacity: 0;
    transform: translateY(-40px) scale(0.92);
  }
  .notif-row {
    display: flex; gap: 18px; align-items: flex-start;
  }
  .notif-icon {
    width: 76px; height: 76px;
    border-radius: 17px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }
  /* iMessage app icon — exact green gradient */
  .notif-icon.imessage {
    background: linear-gradient(180deg, #5BF675 0%, #1FAB3D 100%);
  }
  .notif-icon.imessage::after {
    content: "";
    position: absolute;
    width: 48px; height: 42px;
    background: #FFF;
    border-radius: 50% 50% 50% 8px;
    transform: translate(-2px, 2px);
  }
  /* Claude app icon */
  .notif-icon.claude {
    background: #D97757;
  }
  .notif-icon.claude svg {
    width: 56px; height: 56px;
    z-index: 2;
  }
  .notif-body { flex: 1; min-width: 0; }
  .notif-top {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 2px;
  }
  .notif-app-row {
    display: flex; align-items: center; gap: 8px;
  }
  .notif-app {
    font-size: 24px; font-weight: 600; color: rgba(255,255,255,0.95);
    letter-spacing: -0.2px;
  }
  .notif-time {
    font-size: 22px; color: rgba(255,255,255,0.55);
    font-weight: 500;
  }
  .notif-title {
    font-size: 30px; font-weight: 700; color: #FFF;
    letter-spacing: -0.4px;
    margin-bottom: 4px;
    margin-top: 4px;
  }
  .notif-msg {
    font-size: 26px; color: rgba(255,255,255,0.92);
    line-height: 1.3;
    letter-spacing: -0.2px;
  }
</style>
</head><body>

<!-- Status bar -->
<div class="status-bar">
  <div>9:41</div>
  <div class="icons">
    <span class="signal-bars"><span></span><span></span><span></span><span></span></span>
    <span style="font-size: 22px; font-weight: 600;">5G</span>
    <span class="battery"><span class="battery-fill"></span></span>
  </div>
</div>

<!-- Lock screen big time -->
<div class="lock-time">
  <div class="date">Tuesday, May 27</div>
  <div class="time">9:41</div>
</div>

<!-- Notification stack -->
<div class="notif-stack">
  <!-- iMessage from Claude -->
  <div class="notification" id="n1">
    <div class="notif-row">
      <div class="notif-icon imessage"></div>
      <div class="notif-body">
        <div class="notif-top">
          <div class="notif-app-row">
            <div class="notif-app">Messages</div>
          </div>
          <div class="notif-time">now</div>
        </div>
        <div class="notif-title">Claude</div>
        <div class="notif-msg">Done. All 35 emails drafted and saved to brain/output/. Want me to ship them?</div>
      </div>
    </div>
  </div>

  <!-- Claude Code app notification -->
  <div class="notification" id="n2">
    <div class="notif-row">
      <div class="notif-icon claude">
        <svg viewBox="0 0 100 100" fill="#FFF">
          <rect x='46' y='4' width='8' height='30' rx='4'/>
          <rect x='46' y='66' width='8' height='30' rx='4'/>
          <rect x='4' y='46' width='30' height='8' rx='4'/>
          <rect x='66' y='46' width='30' height='8' rx='4'/>
          <rect x='46' y='4' width='8' height='30' rx='4' transform='rotate(45 50 50)'/>
          <rect x='46' y='66' width='8' height='30' rx='4' transform='rotate(45 50 50)'/>
          <rect x='4' y='46' width='30' height='8' rx='4' transform='rotate(45 50 50)'/>
          <rect x='66' y='46' width='30' height='8' rx='4' transform='rotate(45 50 50)'/>
        </svg>
      </div>
      <div class="notif-body">
        <div class="notif-top">
          <div class="notif-app-row">
            <div class="notif-app">Claude Code</div>
          </div>
          <div class="notif-time">1m ago</div>
        </div>
        <div class="notif-title">Task complete ✓</div>
        <div class="notif-msg">/goal achieved — email sequence shipped to brain/output/</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const tl = gsap.timeline();

  // N1 (iMessage from Claude) slides down — clean, no shake
  tl.fromTo("#n1",
    { opacity: 0, y: -50, scale: 0.94 },
    { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" },
    0.2
  );

  // N2 stacks below
  tl.fromTo("#n2",
    { opacity: 0, y: -40, scale: 0.96 },
    { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
    1.3
  );
</script>
</body></html>
