<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  /* Apple Maps fidelity — real palette + UI hierarchy */
  html, body {
    margin: 0; padding: 0;
    width: 1080px; height: 1920px;
    overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
    background: #F2EDE0; /* Apple Maps land */
  }

  /* iOS status bar */
  .status-bar {
    position: absolute;
    top: 36px; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 56px;
    color: #1A1815; font-size: 30px; font-weight: 600;
    z-index: 20;
  }
  .status-bar .icons {
    display: flex; gap: 14px; align-items: center;
  }
  .signal-bars { display: inline-flex; gap: 4px; align-items: flex-end; }
  .signal-bars span {
    display: block; width: 5px; background: #1A1815; border-radius: 1.5px;
  }
  .signal-bars span:nth-child(1) { height: 7px; }
  .signal-bars span:nth-child(2) { height: 10px; }
  .signal-bars span:nth-child(3) { height: 13px; }
  .signal-bars span:nth-child(4) { height: 16px; }
  .battery {
    width: 46px; height: 22px;
    border: 2px solid #1A1815; border-radius: 5px;
    position: relative; padding: 2px;
  }
  .battery::after {
    content: ""; position: absolute; top: 50%; right: -5px;
    transform: translateY(-50%);
    width: 3px; height: 8px; background: #1A1815; border-radius: 0 2px 2px 0;
  }
  .battery-fill { width: 80%; height: 100%; background: #1A1815; border-radius: 1.5px; }

  /* MAP CANVAS — Apple Maps look */
  .map {
    position: absolute;
    left: 0; right: 0; top: 110px; bottom: 0;
    background: #F2EDE0;
    overflow: hidden;
  }
  .map-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }

  /* Search / Directions bar at top */
  .top-card {
    position: absolute;
    left: 36px; right: 36px; top: 150px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(28px);
    border-radius: 22px;
    padding: 22px 26px;
    display: flex; align-items: center; gap: 18px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.12), 0 1px 0 rgba(0,0,0,0.04);
    z-index: 15;
  }
  .top-card .dir-icon {
    width: 50px; height: 50px;
    background: #4080F0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .top-card .dir-icon svg { width: 28px; height: 28px; }
  .top-card .label-block { flex: 1; }
  .top-card .label-block .from-to {
    font-size: 24px; color: #76706A; font-weight: 600;
    margin-bottom: 2px;
  }
  .top-card .label-block .destination {
    font-size: 30px; color: #1A1815; font-weight: 700;
    letter-spacing: -0.5px;
  }
  .top-card .close-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: #E5E5EA; color: #8E8E93;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; line-height: 1;
  }

  /* Pin styling — Apple Maps style */
  .pin {
    position: absolute;
    z-index: 12;
    transform: translate(-50%, -100%);
  }
  .pin.start {
    left: 280px; top: 760px;
    opacity: 0;
  }
  .pin.end {
    left: 800px; top: 1480px;
    opacity: 0;
  }
  .pin .stem {
    width: 8px; height: 18px;
    background: rgba(0,0,0,0.15);
    margin: 0 auto;
    border-radius: 4px;
  }
  .pin .marker {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 5px solid #FFF;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    font-size: 28px; font-weight: 700; color: #FFF;
    position: relative; top: -10px;
  }
  .pin.start .marker {
    background: #4CD964; /* Apple system green */
  }
  .pin.end .marker {
    background: #FF3B30; /* Apple system red */
  }
  .pin.end .marker::after {
    content: "";
    width: 24px; height: 24px;
    background: #FFF;
    border-radius: 50%;
  }

  /* Live blue dot (current location) */
  .live-dot {
    position: absolute;
    left: 280px; top: 760px;
    width: 30px; height: 30px;
    background: #4080F0;
    border-radius: 50%;
    border: 5px solid #FFF;
    transform: translate(-50%, -50%);
    z-index: 11;
    box-shadow: 0 4px 14px rgba(64,128,240,0.5), 0 0 0 0 rgba(64,128,240,0.35);
    opacity: 0;
  }

  /* Bottom ETA card — Apple Maps style */
  .eta-card {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: #FFFFFF;
    border-radius: 30px 30px 0 0;
    padding: 30px 40px 60px 40px;
    box-shadow: 0 -16px 40px rgba(0,0,0,0.15);
    z-index: 18;
    transform: translateY(100%);
  }
  .eta-handle {
    width: 60px; height: 6px;
    background: #D1D1D6;
    border-radius: 3px;
    margin: 0 auto 22px auto;
  }
  .eta-row {
    display: flex; align-items: flex-end; gap: 16px;
    margin-bottom: 10px;
  }
  .eta-time {
    font-size: 78px; font-weight: 700; color: #1A1815;
    line-height: 1; letter-spacing: -2px;
  }
  .eta-unit {
    font-size: 34px; color: #1A1815; font-weight: 500;
    padding-bottom: 8px;
  }
  .eta-meta {
    font-size: 24px; color: #8E8E93; font-weight: 500;
    margin-bottom: 22px;
  }
  .eta-meta strong { color: #4080F0; font-weight: 600; }
  .eta-buttons {
    display: flex; gap: 14px;
  }
  .eta-go {
    flex: 1;
    background: #4080F0;
    color: #FFF;
    font-size: 30px; font-weight: 700;
    padding: 22px 0;
    border-radius: 999px;
    text-align: center;
    box-shadow: 0 6px 18px rgba(64,128,240,0.4);
    letter-spacing: -0.3px;
  }
  .eta-cancel {
    background: #E5E5EA;
    color: #1A1815;
    font-size: 28px; font-weight: 600;
    padding: 22px 36px;
    border-radius: 999px;
  }

  /* Map controls (top-right) */
  .controls {
    position: absolute;
    right: 36px; top: 360px;
    display: flex; flex-direction: column; gap: 14px;
    z-index: 14;
  }
  .ctrl-btn {
    width: 70px; height: 70px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(20px);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .ctrl-btn svg { width: 36px; height: 36px; }

  /* Compass */
  .compass {
    position: absolute;
    right: 36px; bottom: 530px;
    width: 80px; height: 80px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(20px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    z-index: 14;
  }
  .compass .arrow {
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-bottom: 36px solid #FF3B30;
    position: absolute;
    top: 12px;
  }
  .compass .arrow-tail {
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 36px solid #8E8E93;
    position: absolute;
    bottom: 12px;
  }
</style>
</head><body>

<div class="status-bar">
  <div>9:41</div>
  <div class="icons">
    <span class="signal-bars"><span></span><span></span><span></span><span></span></span>
    <span style="font-size: 22px; font-weight: 600;">5G</span>
    <span class="battery"><span class="battery-fill"></span></span>
  </div>
</div>

<div class="map">
  <svg class="map-svg" viewBox="0 0 1080 1810" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <!-- Water (Apple Maps light blue) — bottom-left corner -->
    <path d="M -50 1450 Q 80 1480, 220 1500 T 480 1620 L 480 1900 L -50 1900 Z" fill="#B0DCF1"/>

    <!-- Parks (Apple Maps light green) -->
    <ellipse cx="220" cy="1100" rx="180" ry="110" fill="#C6E6B0"/>
    <ellipse cx="900" cy="540" rx="160" ry="180" fill="#C6E6B0"/>
    <ellipse cx="660" cy="1280" rx="100" ry="80" fill="#C6E6B0"/>

    <!-- Building blocks (subtle tan) -->
    <g fill="#EAE2CE">
      <rect x="50" y="280" width="140" height="100" rx="4"/>
      <rect x="220" y="280" width="180" height="100" rx="4"/>
      <rect x="430" y="280" width="160" height="100" rx="4"/>
      <rect x="620" y="280" width="100" height="100" rx="4"/>
      <rect x="50" y="420" width="160" height="120" rx="4"/>
      <rect x="240" y="420" width="100" height="120" rx="4"/>
      <rect x="370" y="420" width="140" height="120" rx="4"/>
      <rect x="540" y="420" width="180" height="120" rx="4"/>

      <rect x="50" y="580" width="100" height="160" rx="4"/>
      <rect x="180" y="580" width="160" height="160" rx="4"/>
      <rect x="370" y="580" width="140" height="160" rx="4"/>
      <rect x="540" y="580" width="100" height="160" rx="4"/>
      <rect x="670" y="580" width="140" height="160" rx="4"/>

      <rect x="50" y="800" width="180" height="100" rx="4"/>
      <rect x="260" y="800" width="120" height="100" rx="4"/>
      <rect x="410" y="800" width="160" height="100" rx="4"/>
      <rect x="610" y="800" width="140" height="100" rx="4"/>

      <rect x="50" y="940" width="120" height="120" rx="4"/>
      <rect x="200" y="940" width="180" height="120" rx="4"/>
      <rect x="410" y="940" width="100" height="120" rx="4"/>

      <rect x="540" y="940" width="160" height="120" rx="4"/>
      <rect x="730" y="800" width="180" height="240" rx="4"/>
      <rect x="940" y="800" width="100" height="240" rx="4"/>

      <rect x="50" y="1200" width="160" height="100" rx="4"/>
      <rect x="50" y="1340" width="120" height="100" rx="4"/>

      <rect x="430" y="1100" width="200" height="120" rx="4"/>
      <rect x="430" y="1260" width="180" height="100" rx="4"/>
      <rect x="780" y="1100" width="120" height="100" rx="4"/>
      <rect x="930" y="1100" width="110" height="100" rx="4"/>
      <rect x="780" y="1240" width="160" height="100" rx="4"/>
      <rect x="970" y="1240" width="70" height="100" rx="4"/>

      <rect x="510" y="1400" width="140" height="140" rx="4"/>
      <rect x="680" y="1400" width="160" height="120" rx="4"/>
      <rect x="870" y="1400" width="140" height="120" rx="4"/>
      <rect x="540" y="1580" width="180" height="120" rx="4"/>
      <rect x="750" y="1580" width="140" height="120" rx="4"/>
      <rect x="920" y="1580" width="120" height="120" rx="4"/>
    </g>

    <!-- Highway (yellow with cream border — Apple's major road style) -->
    <g>
      <line x1="0" y1="780" x2="1080" y2="780" stroke="#FFFFFF" stroke-width="42"/>
      <line x1="0" y1="780" x2="1080" y2="780" stroke="#FED867" stroke-width="32"/>
    </g>

    <!-- Secondary white roads -->
    <g stroke="#FFFFFF" stroke-width="22">
      <line x1="0" y1="400" x2="1080" y2="400"/>
      <line x1="0" y1="560" x2="1080" y2="560"/>
      <line x1="0" y1="930" x2="1080" y2="930"/>
      <line x1="0" y1="1080" x2="1080" y2="1080"/>
      <line x1="0" y1="1220" x2="1080" y2="1220"/>
      <line x1="0" y1="1380" x2="1080" y2="1380"/>
      <line x1="0" y1="1560" x2="1080" y2="1560"/>

      <line x1="190" y1="0" x2="190" y2="1900"/>
      <line x1="400" y1="0" x2="400" y2="1900"/>
      <line x1="620" y1="0" x2="620" y2="1900"/>
      <line x1="850" y1="0" x2="850" y2="1900"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="12">
      <line x1="0" y1="690" x2="1080" y2="690"/>
      <line x1="0" y1="850" x2="1080" y2="850"/>
      <line x1="0" y1="1010" x2="1080" y2="1010"/>
      <line x1="0" y1="1150" x2="1080" y2="1150"/>
      <line x1="0" y1="1300" x2="1080" y2="1300"/>
      <line x1="0" y1="1470" x2="1080" y2="1470"/>

      <line x1="100" y1="0" x2="100" y2="1900"/>
      <line x1="290" y1="0" x2="290" y2="1900"/>
      <line x1="510" y1="0" x2="510" y2="1900"/>
      <line x1="730" y1="0" x2="730" y2="1900"/>
      <line x1="960" y1="0" x2="960" y2="1900"/>
    </g>

    <!-- Tiny road labels -->
    <g fill="#8E8E93" font-size="14" font-family="-apple-system, sans-serif" font-weight="500">
      <text x="450" y="775">5TH AVE</text>
      <text x="240" y="555">MARKET ST</text>
      <text x="540" y="1075">HOWARD ST</text>
    </g>

    <!-- Route line — Apple Maps signature blue, behind pins -->
    <path
      id="route"
      d="M 280 760 L 280 850 L 500 850 L 500 1080 L 620 1080 L 620 1380 L 800 1380 L 800 1480"
      stroke="#FFFFFF"
      stroke-width="24"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-dasharray="1600"
      stroke-dashoffset="1600"
    />
    <path
      id="route-blue"
      d="M 280 760 L 280 850 L 500 850 L 500 1080 L 620 1080 L 620 1380 L 800 1380 L 800 1480"
      stroke="#4080F0"
      stroke-width="14"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-dasharray="1600"
      stroke-dashoffset="1600"
    />
  </svg>
</div>

<!-- Top directions card -->
<div class="top-card" id="topCard">
  <div class="dir-icon">
    <svg viewBox="0 0 24 24" fill="#FFF">
      <path d="M12 2 L19 9 L15 9 L15 16 L9 16 L9 9 L5 9 Z" transform="translate(0 2)"/>
    </svg>
  </div>
  <div class="label-block">
    <div class="from-to">DIRECTIONS</div>
    <div class="destination">Anthropic HQ</div>
  </div>
  <div class="close-btn">✕</div>
</div>

<!-- Map controls -->
<div class="controls">
  <div class="ctrl-btn">
    <svg viewBox="0 0 24 24" fill="#4080F0">
      <path d="M12 3 L13 11 L21 12 L13 13 L12 21 L11 13 L3 12 L11 11 Z"/>
    </svg>
  </div>
  <div class="ctrl-btn" style="font-size: 32px; color: #1A1815; font-weight: 300;">+</div>
  <div class="ctrl-btn" style="font-size: 36px; color: #1A1815; font-weight: 300;">−</div>
</div>

<!-- Compass -->
<div class="compass">
  <div class="arrow"></div>
  <div class="arrow-tail"></div>
</div>

<!-- Pins -->
<div class="pin start" id="pinStart">
  <div class="marker">A</div>
  <div class="stem"></div>
</div>
<div class="pin end" id="pinEnd">
  <div class="marker"></div>
  <div class="stem"></div>
</div>

<!-- Live blue dot at current location -->
<div class="live-dot" id="liveDot"></div>

<!-- Bottom ETA card -->
<div class="eta-card" id="etaCard">
  <div class="eta-handle"></div>
  <div class="eta-row">
    <div class="eta-time">12 min</div>
  </div>
  <div class="eta-meta"><strong>4.2 mi</strong> · Fastest route · Arrives at 9:53 AM</div>
  <div class="eta-buttons">
    <div class="eta-go">GO</div>
    <div class="eta-cancel">End</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const tl = gsap.timeline();

  // Top directions card slides in
  tl.fromTo("#topCard",
    { opacity: 0, y: -30 },
    { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
    0.1
  );

  // Start pin drops
  tl.fromTo("#pinStart",
    { opacity: 0, y: -80, scale: 0.5 },
    { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(2)" },
    0.4
  );
  // Live dot fades in
  tl.fromTo("#liveDot",
    { opacity: 0, scale: 0 },
    { opacity: 1, scale: 1, duration: 0.3 },
    0.7
  );
  // Continuous pulse ring on live dot
  tl.to("#liveDot", {
    boxShadow: "0 4px 14px rgba(64,128,240,0.5), 0 0 0 40px rgba(64,128,240,0)",
    duration: 1.6,
    repeat: -1,
    ease: "power2.out"
  }, 0.9);

  // End pin drops
  tl.fromTo("#pinEnd",
    { opacity: 0, y: -80, scale: 0.5 },
    { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(2)" },
    0.9
  );

  // White underlay route draws first
  tl.to("#route", {
    strokeDashoffset: 0,
    duration: 1.4,
    ease: "power2.inOut"
  }, 1.2);
  // Blue route draws over it
  tl.to("#route-blue", {
    strokeDashoffset: 0,
    duration: 1.4,
    ease: "power2.inOut"
  }, 1.3);

  // Bottom ETA card slides up
  tl.fromTo("#etaCard",
    { y: "100%" },
    { y: "0%", duration: 0.7, ease: "power3.out" },
    1.9
  );

  // GO button pulse
  tl.to(".eta-go", {
    scale: 1.05,
    duration: 0.4,
    yoyo: true,
    repeat: 1,
    ease: "sine.inOut"
  }, 2.7);
</script>
</body></html>
