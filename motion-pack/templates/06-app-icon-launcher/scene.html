<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 1080px; height: 1920px;
    background: #0A0808;
    overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "Inter", sans-serif;
  }
  body::before {
    content: ""; position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(circle at 50% 50%, rgba(217,119,87,0.10) 0%, transparent 60%);
  }
  .icon-grid {
    position: absolute;
    left: 0; right: 0; top: 50%;
    transform: translateY(-50%);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-gap: 60px;
    padding: 0 100px;
    z-index: 2;
  }
  .app-tile {
    aspect-ratio: 1;
    border-radius: 56px;
    background: linear-gradient(135deg, #2C2825 0%, #1A1815 100%);
    border: 2px solid rgba(237,217,188,0.12);
    box-shadow: 0 16px 36px rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 110px; font-weight: 900;
    color: #D97757;
    opacity: 0;
    transform: scale(0.4) rotate(-12deg);
  }
  .app-tile.alt { color: #EDD9BC; background: linear-gradient(135deg, #1F1A16 0%, #0A0808 100%); }
  .app-tile.accent { color: #F4A88A; }
</style>
</head><body>
<div class="icon-grid" id="grid">
  <div class="app-tile">/</div>
  <div class="app-tile alt">{ }</div>
  <div class="app-tile accent">↗</div>
  <div class="app-tile alt">⌘</div>
  <div class="app-tile accent">∞</div>
  <div class="app-tile">→</div>
  <div class="app-tile accent">●</div>
  <div class="app-tile alt">⎈</div>
  <div class="app-tile">⌃</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const tl = gsap.timeline();
  tl.to(".app-tile", {
    opacity: 1, scale: 1, rotation: 0,
    duration: 0.55, ease: "back.out(1.6)",
    stagger: { each: 0.08, from: "random" }
  }, 0.1);
  tl.to(".app-tile", {
    y: -8, duration: 0.6, yoyo: true, repeat: -1, ease: "sine.inOut",
    stagger: { each: 0.05, from: "random" }
  }, ">-0.2");
</script>
</body></html>
